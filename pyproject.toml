[project]
name = "warden"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.3.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
]

[project.scripts]
warden = "bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
